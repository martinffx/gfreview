name: Release

on:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: gfreview-macos-arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: gfreview-macos-x64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: gfreview-linux-x64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: gfreview-windows-x64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile

      - name: Build
        run: bun build index.ts --compile --outfile dist/${{ matrix.artifact }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2

      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: gfreview-*
          merge-multiple: true

      - name: Checksum
        run: |
          cd dist
          sha256sum * > checksums.txt

      - name: Generate release notes
        id: changelog
        run: |
          bun x conventional-changelog-cli -p angular > changelog.tmp
          NOTES=$(cat changelog.tmp)
          echo "notes<<EOF" >> $GITHUB_OUTPUT
          echo "$NOTES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body: ${{ steps.changelog.outputs.notes }}

  publish-npm:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile

      - name: Set version from tag
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          jq --arg v "$VERSION" '.version = $v' package.json > package.json.tmp
          mv package.json.tmp package.json

      - name: Build JS bundle
        run: bun run build:node

      - name: Generate type declarations
        run: bun run build:types

      - name: Configure npm auth
        run: echo "//registry.npmjs.org/:_authToken=${{ secrets.NPM_TOKEN }}" > ~/.npmrc

      - run: bun publish --access public
